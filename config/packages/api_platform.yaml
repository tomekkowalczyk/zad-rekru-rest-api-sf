api_platform:
    title: Catalog API
    description: |
        Product catalog with asynchronous, multi-channel notifications.
        Authenticate with `POST /api/login` and send the returned JWT as
        `Authorization: Bearer <token>`.
    version: 1.0.0

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # Anti-DoS: clients may not request unbounded collections.
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 100
        pagination_items_per_page: 30

    # Business rule violations are client errors, not server errors.
    # The first matching entry wins, so specific exceptions go first.
    exception_to_status:
        App\Catalog\Domain\Exception\CategoryStillInUse: 409
        App\Catalog\Domain\Exception\DuplicateCategoryCode: 409
        App\Shared\Domain\Exception\DomainException: 422

    mapping:
        paths:
            - '%kernel.project_dir%/src/Catalog/Infrastructure/ApiPlatform/Resource'
